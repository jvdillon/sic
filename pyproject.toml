[project]
name = "sic"
version = "0.1.0"
description = "Speed is Confidence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11.10"
authors = [
    { name = "Joshua V. Dillon" },
]
keywords = ["research", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch==2.9.0",
    "einops",
    "einshape",
    "jaxtyping",
    "numpy>=2.1",
    # dataset/build_*_dataset.py deps
    "argdantic",
    "pydantic",
    "tqdm",
    "huggingface_hub",
]
[dependency-groups]
dev = [
    "basedpyright>=1.10",
    "codespell>=2.2.4",
    "gnureadline",
    "ipython",
    "pre-commit>=3.5",
    "pytest>=7.0",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/jvdillon/sic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]
exclude = ["*_test.py", "*.log"]

[tool.hatch.build.targets.wheel.sources]
"code" = "sic"

[tool.pytest.ini_options]
python_files = ["*_test.py"]
addopts = ["-Werror", "--import-mode=importlib"]
norecursedirs = [".venv", "__pycache__", ".typings", "*.egg-info"]
testpaths = ["code/"]
pythonpath = ["code/"]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning:coroutine.*was never awaited"]

[tool.coverage.run]
omit = [
    "*_test.py",
    "*/tests/*",
    "*/.venv/*",
    "*/.typings/*",
    "*/tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
fix = true
show-fixes = true
line-length = 88
output-format = "concise"
target-version = "py311"
exclude = [".venv", ".typings", "*.egg-info", ".pytest_cache", "build", "dist", "research/third_party", "research/tools"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # modules
    "ANN",     # flake8-annotations
    "COM812",
    #"COM818",  # trailing comma on bare tuple
    #"COM819",  # trailing comma prohibited (conflicts with formatter)
    "C90",     # mccabe complexity
    "DJ",      # django
    "EXE",     # flake8-executable
    "TID",     # flake8-tidy-imports

    # specific rules
    "A001",    # Variable `input` is shadowing a Python builtin
    "A002",    # Function argument `repr` is shadowing a Python builtin
    "B008",    # Do not perform function call `Default` in argument defaults
    "D100",    # undocumented public module
    "D101",    # undocumented public class
    "D102",    # undocumented public method
    "D103",    # undocumented public function
    "D104",    # undocumented public package
    "D105",    # undocumented public magic method
    "D106",    # undocumented public nested class
    "D107",    # undocumented public init
    "D203",    # incorrect blank line before class
    "D205",    # blank line required between summary line and description
    "D213",    # multi-line-summary-second-line
    "D400",    # end with punc
    "D401",    # Imperative mood.
    "D415",    # end with punc
    "D417",    # Missing argument in docstring
    "DTZ006",  # `datetime.datetime.fromtimestamp()` called without a `tz` argument
    # "E402",    # module-import-not-at-top-of-file (E402)
    "E501",    # Line too long (will be fixed by formatter)
    "EM101",   # Exception must not use an string literal
    "EM102",   # Exception must not use an f-string literal
    "ERA001",  # Found commented-out code
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean positional value in function call
    "FIX001",  # Line contains FIXME, consider resolving the issue
    "FIX002",  # too verbose descriptions of todos
    "G004",    # Logging statement uses f-string
    "ICN001",  # `xml.etree.ElementTree` should be imported as `ET`
    "INP001",  # implicit namespace package
    "N801",    # Class name `TRM_ZeroL` should use CapWords convention.
    "N802",    # Function name `_get_all_H_inits` should be lowercase.
    "N803",    # Argument name should be lowercase.
    "N806",    # Variable `V_t_i` in function should be lowercase
    "N813",    # Camelcase `ElementTree` imported as lowercase `xml`
    "N815",    # Variable in class scope should not be mixedCase.
    "PERF403", # Use a dictionary comprehension instead of a for-loop
    "PGH004",  # Use specific rule codes when using `noqa`
    "PLR0912", # Too many branches (>12)
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements (>50)
    "PLR1704", # Redefining argument with the local name `dtype`
    "PLR2004", # Magic value in comparison.
    "PLR2044", # Empty comment.
    "PLW0642", # Reassignment of name in finalize
    "PT027",   # Use `pytest.raises` instead of unittest-style `assertRaises`
    "RET504",  # return assignment
    "RUF002",  # Docstring contains ambiguous latin letter.
    "RUF003",  # Comment contains ambiguous latin letter.
    "S101",    # Use of assert.
    "S301",    # `pickle` can be unsafe
    "SIM108",  # Use ternary operator
    # "SLF001",  # Private member accessed
    "T201",    # remove print
    "TC001",   # Move import (will be fixed by formatter).
    "TC003",   # Move import (will be fixed by formatter).
    "TC006",   # runtime-cast-value
    "TD001",   # Invalid TODO tag: `FIXME`
    "TD003",   # missing-todo-link (TD003)
    "TD004",   # Missing colon in TODO
    "TD005",   # Missing issue description after `TODO`
    "TRY003",  # external messages in exceptions are too verbose
    "TRY300",  # move to else
]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true
default-section = "third-party"
detect-same-package = true
force-single-line = false
force-sort-within-sections = false
from-first = true
lines-between-types = 1
lines-after-imports = 2
# extra-standard-library = ["typing","typing_extensions"]
known-first-party = ["core", "ae", "gm", "data", "tools"]
no-lines-before = ["future"] #, "standard-library"]
order-by-type = true
relative-imports-order = "closest-to-furthest"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
extraPaths = ["code/", "code/sudoku/", ".typings"]
exclude = [".venv", ".typings", "*.egg-info", ".pytest_cache", "build", "dist", "paper"]
ignore = [".venv", ".typings", "*.egg-info", ".pytest_cache", "build", "dist", "paper"]
stubPath = ".typings"
pythonPlatform = "Linux"
pythonVersion = "3.11"
reportAny = false
reportCallInDefaultInitializer = false
reportConstantRedefinition = false
reportExplicitAny = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false  # Otherwise conflicts with Ruff ISC003 explicit-string-concatenation.
reportIncompatibleMethodOverride = false
reportMissingSuperCall = false
reportPrivateImportUsage = false
reportPrivateLocalImportUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnsafeMultipleInheritance = false
reportUnreachable = false
reportUnusedCallResult = false
reportUnusedImport = false

[tool.codespell]
builtin = "clear,rare,code"
ignore-words-list = "fave,jupyter,arange,iff,wrt,ow,lite,falsy,truthy,ws,deque,numer,warmup"
skip = "htmlcov,.doctrees,*.pyc,*.ico,*.png,*.jpg,*.PNG,*.inv,*.dot,*.css,.git,.venv,.typings/*,__pycache__,*.egg-info,uv.lock,nsfw*.txt,research/third_party/*"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.uv]
package = false

[tool.uv.pip]
compile-bytecode = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu130"}]
torchao = [{index = "pytorch-cu130"}]
torchaudio = [{index = "pytorch-cu130"}]
torchvision = [{index = "pytorch-cu130"}]
