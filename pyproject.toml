[project]
name = "sic"
version = "0.1.0"
description = "Speed is Confidence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    {name = "Joshua V. Dillon"},
]
keywords = ["research", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "setuptools",
    "torch==2.9.0",
    "configgle>=1.1.10",
    "einops",
    "einshape",
    "jaxtyping",
    "numpy>=2.1",
    # dataset/build_*_dataset.py deps
    "argdantic",
    "pydantic",
    "tqdm",
    "huggingface_hub",
]

[dependency-groups]
debug = [
    "gnureadline",
    "ipdb",
    "ipython",
    "matplotlib",
    "scipy",
]
lint = [
    "basedpyright>=1.10",
    "codespell>=2.2.4",
    "pre-commit>=3.5",
    "pytest>=7.0",
    "ruff>=0.8",
    "ty>=0.0.17",
]
dev = [
    {include-group = "debug"},
    {include-group = "lint"},
]

[project.urls]
Repository = "https://github.com/jvdillon/sic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]
exclude = ["*_test.py", "*.log"]

[tool.hatch.build.targets.wheel.sources]
"code" = ""

[tool.pytest.ini_options]
python_files = ["*_test.py"]
addopts = ["-Werror", "--import-mode=importlib"]
norecursedirs = [".venv", "__pycache__", ".typings", "*.egg-info"]
testpaths = ["code/"]
pythonpath = ["code/"]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning:coroutine.*was never awaited"]

[tool.coverage.run]
omit = [
    "*_test.py",
    "*/tests/*",
    "*/.venv/*",
    "*/.typings/*",
    "*/tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
fix = true
show-fixes = true
line-length = 88
output-format = "concise"
target-version = "py312"
exclude = [
    ".venv",
    "*.egg-info",
    ".pytest_cache",
    "build",
    "dist",
    ".typings",
]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Module-level ignores.
    "ANN",     # Flake8 annotations. (We use pyright for type checking.)
    "C90",     # McCabe complexity. (One function slightly over threshold.)
    "COM812",  # Missing trailing comma. (Conflicts with formatter.)

    # Relax docstring rules.
    "D100",    # Undocumented public module.
    "D101",    # Undocumented public class.
    "D102",    # Undocumented public method.
    "D103",    # Undocumented public function.
    "D104",    # Undocumented public package.
    "D105",    # Undocumented magic method.
    "D106",    # Undocumented public nested class.
    "D107",    # Undocumented public init.
    "D203",    # Incorrect blank line before class. (Conflicts with D211.)
    "D205",    # Missing blank line after summary.
    "D213",    # Multi-line summary second line. (Conflicts with D212.)
    "D400",    # Missing trailing period.
    "D401",    # Non-imperative mood.
    "D415",    # Missing terminal punctuation.

    # Standard style relaxations.
    "A002",    # Builtin argument shadowing.
    "E501",    # Line too long. (Will be fixed by formatter.)
    "EM101",   # Raw string in exception.
    "EM102",   # F-string in exception.
    "ERA001",  # Commented-out code.
    "FBT001",  # Boolean type hint positional argument.
    "FBT002",  # Boolean default value positional argument.
    "FBT003",  # Boolean positional value in call.
    "FIX002",  # Line contains TODO. (Too verbose descriptions of TODOs.)
    "N806",    # Non-lowercase variable in function.
    "PLR0912", # Too many branches.
    "PLR0913", # Too many arguments.
    "PLR0915", # Too many statements.
    "RET504",  # Unnecessary assign.
    "TC001",   # Typing-only first-party import. (Will be fixed by formatter.)
    "TC003",   # Typing-only standard library import. (Will be fixed by formatter.)
    "TC006",   # Runtime cast value.
    "TRY003",  # Raise vanilla args.
    "TRY300",  # Try consider else.

    # Extra
    "D417",    # Missing argument in docstring
    "EXE001",  # flake8-executable
    "N802",    # Invalid function name.
    "N803",    # Invalid argument name.
    "N815",    # Mixed case variable in class scope.
    "PLR2004", # Magic value comparison.
    "RUF002",  # Docstring contains ambiguous latin letter.
    "S101",    # Use of `assert` detected.
    "S301",    # `pickle` can be unsafe
    "T201",    # remove print
    "TD003",   # Missing TODO link.
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",    # Unused import.
]
"{*_test.py,tests/*}" = [
    "INP001",  # Implicit namespace package. (Tests don't need __init__.py.)
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "S301",    # Suspicious pickle usage.
    "SLF001",  # Private member access.
]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true
default-section = "third-party"
detect-same-package = true
force-single-line = false
force-sort-within-sections = false
from-first = true
lines-between-types = 1
lines-after-imports = 2
no-lines-before = ["future"]
order-by-type = true
relative-imports-order = "closest-to-furthest"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
extraPaths = ["code/", "code/sudoku/", ".typings"]
exclude = [
    ".venv",
    "*.egg-info",
    ".pytest_cache",
    "build",
    "dist",
    ".typings",
    "paper",
]
ignore = [
    ".venv",
    "*.egg-info",
    ".pytest_cache",
    "build",
    "dist",
    ".typings",
    "paper",
]
stubPath = ".typings"
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportAny = false                          # `Any` propagation is pervasive in PyTorch.
reportExplicitAny = false                  # Explicit `Any` annotations are intentional.
reportImplicitStringConcatenation = false  # Conflicts with ruff ISC003.
reportInvalidCast = false                  # All cast() calls are intentional.
reportUnannotatedClassAttribute = false    # Class attributes don't always need annotations.
reportUnusedCallResult = false             # Discarding return values is idiomatic Python.
# Extra suppressions.
reportCallInDefaultInitializer = false     # Immutable constructors (e.g. NamedTuple) in defaults are safe.
reportIncompatibleMethodOverride = false   # Subclasses may rename parameters.
reportMissingSuperCall = false             # Fires on plain `object` inheritance (no-op super).
reportUnsafeMultipleInheritance = false    # Mixin patterns are intentional.
reportConstantRedefinition = false         # Uppercase locals treated as constants (math). [Violates PEP8]
reportImplicitOverride = false
reportPrivateImportUsage = false
reportPrivateLocalImportUsage = false
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnreachable = false
reportUnusedImport = false

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["code/", "code/sudoku/", ".typings"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "warn"

[tool.codespell]
builtin = "clear,rare,code"
ignore-words-list = "fave,jupyter,arange,iff,wrt,ow,lite,falsy,truthy,ws,deque,numer,warmup"
skip = "htmlcov,.doctrees,*.pyc,*.ico,*.png,*.jpg,*.PNG,*.inv,*.dot,*.css,.git,.venv,__pycache__,*.egg-info,uv.lock,.typings/*"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.uv]
package = true

[tool.uv.pip]
compile-bytecode = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu130"}]
torchao = [{index = "pytorch-cu130"}]
torchaudio = [{index = "pytorch-cu130"}]
torchvision = [{index = "pytorch-cu130"}]
